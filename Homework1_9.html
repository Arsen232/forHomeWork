<!DOCTYPE html>
<html lang = 'en'>
<head>
    <meta charset = 'UTF-8'>
    <meta name = 'viewport' content = 'width = device-width, initial-scale = 1.0'>
    <title>Homework</title>
</head>
<body>
    <ul>
        <li>Banana</li>
        <li>Apple</li>
        <li>Mandarine</li>
        <li>Orange</li>
        <li>Lemon</li>
    </ul>
    <ol>
        <li>Sit next to your pc</li>
        <li>Turn it on</li>
        <li>Open VSCode</li>
        <li>Start programming</li>
        <li>Create a beautiful website and go, rest</li>
    </ol>
    <table border = '1'>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Hobby</th>
        </tr>
        <tr>
            <td>Arsen</td>
            <td>15</td>
            <td>IT</td>
        </tr>
        <tr>
            <td>Mansur</td>
            <td>12</td>
            <td>Wrestling</td>
        </tr>
    </table>
</body>
</html>
<!--ol создает нумерованный список, ul - обычный, без каких либо нумерований, li - части списков ol и ul-->
<!--table создает таблицу, tr - названия или данные внутри таблицы, th - вверхние, td - нижние данные-->
