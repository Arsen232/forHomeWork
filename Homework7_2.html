<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial scale = 1.0">
   <title>Hw7.2</title>
   <link rel="stylesheet">
</head>
<body>
    <script>
        let age = 30;
        console.log(age);
        const birthYear = 2010;
        console.log(birthYear);
        // let можно сменить для выполнения вычислений с новыми данными, не меняя формулу, а const не меняется для того чтобы хранить постоянные данные
        var name = "Arsen";
        console.log(name);
        var name = "Temirlan";
        console.log (name);
        // var не используется по простой причине - у нас есть более стабильные переменные в лице let и const
        let integer = 7;
        console.log(integer);
        let string = "Hello";
        let string2 = "World";
        let stringCombine = `${string}, ${string2}!`;
        console.log(stringCombine);
        let notANumber = NaN;
        let invalidOperation = 0/0;
        console.log(invalidOperation);
        let isFalse = false;
        console.log(isFalse);
        let user = null;
        console.log(user);
        let undefinedValue = undefined;
        console.log(undefinedValue);
        console.log(Number(user));
        console.log(Number(undefinedValue));
        strNum = String(age);
        console.log(strNum);
        prompt (name = "Arsen", age = 15);
        console.log(prompt(name));
    </script>
</body>
